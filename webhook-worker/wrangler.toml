name = "ateliers-common-label-webhook"
main = "src/index.js"
compatibility_date = "2026-11-24"

[vars]
GITHUB_ORGANIZATION = "Ateliers-Dev"

# Run `npx wrangler secret put <NAME>` from this webhook-worker directory.
# Set all seven values as Worker secrets; never commit credentials:
# GITHUB_APP_ID
# GITHUB_APP_INSTALLATION_ID
# GITHUB_APP_PRIVATE_KEY
# GITHUB_WEBHOOK_SECRET
# COMMON_LABEL_DISPATCH_SECRET
# DISPATCH_REPOSITORY_ID
# DISPATCH_REPOSITORY_NAME (value: .github)

